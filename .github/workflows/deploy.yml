name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/setup
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd neocentra-bank-host
          npm ci

      - name: Run Lint
        run: |
          cd neocentra-bank-host
          npm run lint || echo "Lint warnings allowed"

      - name: Run Tests
        run: |
          cd neocentra-bank-host
          npm run test -- --run

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/setup'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Workspace Structure
        run: |
          mkdir -p temp_build/neocentra-bank-host
          find . -maxdepth 1 -not -name '.' -not -name 'temp_build' -exec cp -r {} temp_build/neocentra-bank-host/ \;

      - name: Clone Other MFE Dependencies
        run: |
          for mfe in shared auth dashboard layout; do
            if [ -n "${{ secrets.GH_PAT }}" ]; then
              git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/neocentra-bank-${mfe}.git temp_build/neocentra-bank-${mfe}
            else
              git clone https://github.com/${{ github.repository_owner }}/neocentra-bank-${mfe}.git temp_build/neocentra-bank-${mfe}
            fi
          done

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: temp_build
          file: temp_build/neocentra-bank-host/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neocentra-bank-host:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/neocentra-bank-host:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/setup'
    steps:
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K8s
        run: |
          kubectl set image deployment/neocentra-mfe-host host-mfe=ghcr.io/${{ github.repository_owner }}/neocentra-bank-host:${{ github.sha }} --record
          kubectl rollout status deployment/neocentra-mfe-host
